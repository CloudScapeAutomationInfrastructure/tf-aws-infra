name: Terraform CI

on:
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Run Terraform Fmt and Validate
    runs-on: ubuntu-latest

    steps:
      # Checkout the code from the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.3.0 # Set the version you're using

      # Initialize Terraform (download providers, initialize backend, etc.)
      - name: Terraform Init
        run: terraform init

      # Run Terraform Fmt to check if formatting is correct
      - name: Run terraform fmt
        run: terraform fmt -recursive

      # Run Terraform Validate to ensure configuration is valid
      - name: Run terraform validate
        run: terraform validate
